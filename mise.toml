[tools]
cocogitto = "latest"
prek = { version = "latest", postinstall = "prek install" }
uv = "latest"
python = "3.14.7"
[deps]
uv = { auto = true }

[settings]
lockfile = true

[tasks.check]
depends = ["format", "lint", "typecheck", "pytest"]

[tasks.format]
run = "uv run ruff format"

[tasks.lint]
run = "uv run ruff check --fix"

[tasks.typecheck]
run = "uv run ty check"

[tasks.pytest]
run = "uv run pytest"

[tasks.build]
description = "Build and run the container locally against .env"
run = [
  "podman build -t localhost/woodpecker-mcp:dhi .",
  '''podman run --rm -it -p 8000:8000 --env-file .env \
  --read-only --cap-drop ALL --security-opt no-new-privileges \
  localhost/woodpecker-mcp:dhi''',
]
