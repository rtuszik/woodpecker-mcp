---
name: CI

on:
    push:
        branches: ["**"]

permissions:
    contents: read

jobs:
    conventional-commits:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                fetch-depth: 0
                persist-credentials: false
                ref: ${{ github.event.pull_request.head.sha || github.sha }}
            - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
            # Ignore history from before Conventional Commits were enforced.
            - run: cog check 1a4e1a6..HEAD

    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false
            - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
              with:
                enable-cache: true
            - run: uv sync --locked
            - run: uv run ruff check
            - run: uv run vulture . --exclude "*settings.py,*/docs/*.py,*/test_*.py,*/.venv/*.py" --min-confidence 100
            - run: uv run ty check

    pytest:
        runs-on: ubuntu-latest
        needs: check
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false
            - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
              with:
                enable-cache: true
            - run: uv sync --locked
            - run: uv run pytest
    zizmor:
        runs-on: ubuntu-latest
        permissions:
            security-events: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Run zizmor 🌈
              uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4

