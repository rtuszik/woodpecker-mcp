---
name: CI

on:
    push:
        branches: ["**"]

permissions:
    contents: read

jobs:
    conventional-commits:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                fetch-depth: 0
                persist-credentials: false
                ref: ${{ github.event.pull_request.head.sha || github.sha }}
            - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
            # Ignore history from before Conventional Commits were enforced.
            - run: cog check 1a4e1a6..HEAD

    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false
            - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
              with:
                enable-cache: true
            - run: uv sync --locked
            - run: uv run ruff check
            - run: uv run vulture . --exclude "*settings.py,*/docs/*.py,*/test_*.py,*/.venv/*.py" --min-confidence 100
            - run: uv run ty check

    pytest:
        runs-on: ubuntu-latest
        needs: check
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false
            - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
              with:
                enable-cache: true
            # bun and node for the MCP Inspector tests
            - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
              with:
                install_args: bun node
            - run: uv sync --locked
            - run: uv run pytest
    zizmor:
        runs-on: ubuntu-latest
        permissions:
            security-events: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Run zizmor 🌈
              uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0

