---
name: CI

on:
    push:
        branches: ["**"]

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false
            - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
              with:
                enable-cache: true
            - run: uv sync --locked
            - run: uv run ruff check
            - run: uv run vulture . --exclude "*settings.py,*/docs/*.py,*/test_*.py,*/.venv/*.py" --min-confidence 100
            - run: uv run ty check

    pytest:
        runs-on: ubuntu-latest
        needs: check
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false
            - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
              with:
                enable-cache: true
            - run: uv sync --locked
            - run: uv run pytest
