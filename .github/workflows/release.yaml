---
name: Release

on:
    release:
        types: [published]

permissions: {}

env:
    IMAGE: ghcr.io/rtuszik/woodpecker-mcp

jobs:
    version:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false
            - name: Release tag must match pyproject version
              env:
                TAG: ${{ github.event.release.tag_name }}
              run: |
                version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
                if [ "${TAG#v}" != "$version" ]; then
                  echo "::error::release tag $TAG does not match pyproject.toml version $version" >&2
                  exit 1
                fi

    ghcr:
        runs-on: ${{ matrix.runner }}
        needs: version
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux/amd64
                      runner: ubuntu-latest
                    - platform: linux/arm64
                      runner: ubuntu-24.04-arm
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false
            - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                registry: dhi.io
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
            - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              id: meta
              with:
                images: ${{ env.IMAGE }}
            # Push by digest only; the manifest job assembles the tagged list.
            - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              id: build
              with:
                context: .
                platforms: ${{ matrix.platform }}
                labels: ${{ steps.meta.outputs.labels }}
                outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
                cache-from: type=gha,scope=${{ matrix.platform }}
                cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
            - name: Export digest
              env:
                DIGEST: ${{ steps.build.outputs.digest }}
              run: |
                mkdir -p "${RUNNER_TEMP}/digests"
                touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                name: digest-${{ runner.arch }}
                path: ${{ runner.temp }}/digests/*
                if-no-files-found: error
                retention-days: 1

    manifest:
        runs-on: ubuntu-latest
        needs: ghcr
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                path: ${{ runner.temp }}/digests
                pattern: digest-*
                merge-multiple: true
            - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              id: meta
              env:
                # Per-arch images carry labels; the manifest list carries annotations.
                DOCKER_METADATA_ANNOTATIONS_LEVELS: index
              with:
                images: ${{ env.IMAGE }}
                tags: |
                    type=semver,pattern={{version}}
                    type=semver,pattern={{major}}.{{minor}}
            - name: Create and push manifest list
              working-directory: ${{ runner.temp }}/digests
              env:
                TAGS: ${{ steps.meta.outputs.tags }}
                ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
              run: |
                shopt -s nullglob
                args=()
                while IFS= read -r tag; do
                  if [ -n "$tag" ]; then args+=(--tag "$tag"); fi
                done <<< "$TAGS"
                while IFS= read -r annotation; do
                  if [ -n "$annotation" ]; then args+=(--annotation "$annotation"); fi
                done <<< "$ANNOTATIONS"
                sources=()
                for digest in *; do
                  sources+=("${IMAGE}@sha256:${digest}")
                done
                if [ ${#sources[@]} -eq 0 ]; then
                  echo "::error::no per-architecture digests found" >&2
                  exit 1
                fi
                docker buildx imagetools create "${args[@]}" "${sources[@]}"
            - name: Inspect manifest list
              env:
                VERSION: ${{ steps.meta.outputs.version }}
              run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"

    pypi:
        runs-on: ubuntu-latest
        needs: version
        environment: pypi
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false
            - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
              with:
                enable-cache: false
            - run: uv build
            - run: uv publish --trusted-publishing always
