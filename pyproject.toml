#:schema https://www.schemastore.org/pyproject.json

[project]
name = "woodpecker-ci-mcp"
version = "0.1.0"
description = "MCP server for Woodpecker CI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastmcp>=3.4.4",
  "httpx>=0.28.1",
  "pydantic>=2.13.4",
  "pyyaml>=6.0.3",
]

[project.urls]
Repository = "https://github.com/rtuszik/woodpecker-mcp"

[project.scripts]
woodpecker-ci-mcp = "woodpecker_mcp.__main__:main"
woodpecker-mcp = "woodpecker_mcp.__main__:main"

[dependency-groups]
dev = [
  "deptry>=0.25.1",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.22",
  "ty>=0.0.61",
  "vulture>=2.16",
]

[build-system]
requires = ["uv_build>=0.11.30,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint]
ignore = ["S104", "ARG002"]
extend-select = [
  "B",
  "S",
  "SIM",
  "T20",
  "C901",
  "PTH",
  "TID",
  "RET",
  "ICN",
  "ISC",
  "FA",
  "C4",
  "UP",
  "I",
  "E",
  "W",
  "F",
  "RUF",
  "ASYNC",
  "BLE",
  "A",
  "FAST",
  "FBT",
  "DTZ",
  "LOG",
  "PIE",
  "PYI",
  "PT",
  "ARG",
  "N",
  "PERF",
  "FURB"
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "S107", "ARG005"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = false

[tool.uv.build-backend]
module-name = "woodpecker_mcp"

[tool.vulture]
min_confidence = 80
